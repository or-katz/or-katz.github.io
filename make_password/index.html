<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הוצאות חופשה</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 text-gray-800 font-sans">
    <div id="mainApp" class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-xl print:hidden">
        <h1 class="text-2xl font-extrabold mb-6 text-center text-indigo-700">ניהול הוצאות חופשה</h1>
        
        <!-- ניהול חברים -->
        <div class="mb-8">
            <h2 class="text-lg font-bold mb-3 border-b pb-2">1. הוספת חברים</h2>
            <div class="flex gap-2">
                <input type="text" id="memberName" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-indigo-300 outline-none" placeholder="הכנס שם חבר...">
                <button onclick="addMember()" class="bg-indigo-600 hover:bg-indigo-700 transition text-white px-6 py-3 rounded-lg font-semibold">הוסף</button>
            </div>
            <div id="membersList" class="mt-4 flex flex-wrap gap-2"></div>
        </div>

        <!-- הוספת / עריכת הוצאה -->
        <div class="mb-8 bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
            <h2 id="expenseFormTitle" class="text-lg font-bold mb-4 border-b pb-2 text-indigo-800">2. הוספת הוצאה</h2>
            <div class="space-y-4">
                <input type="hidden" id="editExpenseId">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="date" id="expDate" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-indigo-300 outline-none">
                    <input type="text" id="expDesc" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-indigo-300 outline-none" placeholder="תיאור ההוצאה (למשל: מסעדה)">
                </div>
                
                <div id="membersExpenseInputs" class="space-y-4 mt-4">
                    <!-- שדות תשלום ואחוזים יוזרקו לכאן -->
                </div>

                <div class="flex gap-2 mt-6">
                    <button onclick="saveExpense()" id="saveExpenseBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 transition text-white p-4 rounded-xl font-bold text-lg shadow-md">
                        שמור הוצאה
                    </button>
                    <button onclick="cancelEdit()" id="cancelEditBtn" class="hidden bg-gray-400 hover:bg-gray-500 transition text-white p-4 rounded-xl font-bold text-lg shadow-md">
                        ביטול
                    </button>
                </div>
            </div>
        </div>

        <!-- רשימת הוצאות וסיכום -->
        <div class="space-y-6">
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <h2 class="text-lg font-bold mb-0 border-b p-4 bg-gray-50 flex justify-between items-center">
                    רשימת הוצאות
                    <button onclick="clearAllData()" class="text-xs text-red-500 hover:text-red-700 font-normal underline">מחיקת נתונים ואיפוס</button>
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 border-b">
                                <th class="p-3">תאריך</th>
                                <th class="p-3">תיאור</th>
                                <th class="p-3">סה"כ</th>
                                <th class="p-3 text-center">פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- אזור התחשבנות - מופיע אוטומטית -->
            <div id="resultsArea" class="mt-4 p-5 rounded-xl border whitespace-pre-line text-base hidden font-medium leading-relaxed shadow-inner"></div>
            
            <button onclick="openReport()" class="w-full bg-blue-600 hover:bg-blue-700 transition text-white p-4 rounded-xl font-bold text-lg shadow-md mt-4 flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                הצג דוח מפורט (לשמירה כ-PDF)
            </button>
        </div>
    </div>

    <!-- אזור הדוח -->
    <div id="reportView" class="hidden max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-xl print:block print:shadow-none print:p-0">
        <div class="flex justify-between items-center mb-8 print:hidden border-b pb-4">
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-bold shadow flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                הדפס / שמור כ-PDF
            </button>
            <button onclick="closeReport()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg font-bold shadow">חזור אחורה</button>
        </div>
        <div id="reportContent" class="text-right"></div>
    </div>

    <script>
        // משתנים גלובליים
        let members = [];
        let expenses = [];
        let currentPercentages = {};

        // מפתחות לשמירה ב-localStorage
        const STORAGE_KEY_MEMBERS = 'holiday_expenses_members_db';
        const STORAGE_KEY_EXPENSES = 'holiday_expenses_data_db';

        // טעינת נתונים ראשונית
        function loadData() {
            try {
                const storedMembers = localStorage.getItem(STORAGE_KEY_MEMBERS);
                const storedExpenses = localStorage.getItem(STORAGE_KEY_EXPENSES);
                
                if (storedMembers) members = JSON.parse(storedMembers);
                if (storedExpenses) expenses = JSON.parse(storedExpenses);
            } catch (e) {
                members = [];
                expenses = [];
            }
        }

        // שמירת נתונים
        function saveData() {
            localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(members));
            localStorage.setItem(STORAGE_KEY_EXPENSES, JSON.stringify(expenses));
        }

        // ניקוי כל הנתונים
        function clearAllData() {
            if(confirm("האם אתה בטוח שברצונך למחוק את כל הנתונים וההיסטוריה?")) {
                localStorage.removeItem(STORAGE_KEY_MEMBERS);
                localStorage.removeItem(STORAGE_KEY_EXPENSES);
                members = [];
                expenses = [];
                currentPercentages = {};
                cancelEdit();
                renderUI();
                calculateSettlement();
            }
        }

        function addMember() {
            const name = document.getElementById('memberName').value.trim().replace(/['"]/g, '');
            if (name && !members.includes(name)) {
                members.push(name);
                saveData(); 
                document.getElementById('memberName').value = '';
                initPercentages();
                renderUI();
            }
        }

        function removeMember(name) {
            if(confirm(`האם להסיר את ${name}? (לא יימחק מהוצאות קיימות)`)) {
                members = members.filter(m => m !== name);
                saveData(); 
                initPercentages();
                renderUI();
            }
        }

        function initPercentages() {
            if(members.length === 0) return;
            const equalShare = 100 / members.length;
            members.forEach(m => currentPercentages[m] = equalShare);
        }

        function updatePercentage(targetName, delta) {
            if(members.length <= 1) return;
            
            let currentPaid = {};
            document.querySelectorAll('.paid-amount').forEach(input => {
                currentPaid[input.dataset.name] = input.value;
            });
            
            let currentTargetValue = currentPercentages[targetName];
            let newTargetValue = Math.max(0, Math.min(100, currentTargetValue + delta));
            let diff = newTargetValue - currentTargetValue;
            
            if (diff === 0) return;

            currentPercentages[targetName] = newTargetValue;
            
            let others = members.filter(m => m !== targetName);
            let totalOthers = others.reduce((sum, m) => sum + currentPercentages[m], 0);
            
            if (totalOthers > 0) {
                others.forEach(m => {
                    let proportion = currentPercentages[m] / totalOthers;
                    currentPercentages[m] = Math.max(0, currentPercentages[m] - (diff * proportion));
                });
            } else {
                let share = diff / others.length;
                others.forEach(m => {
                    currentPercentages[m] = Math.max(0, currentPercentages[m] - share);
                });
            }
            
            normalizePercentages();
            renderExpenseInputs(currentPaid); 
        }

        function normalizePercentages() {
            let total = members.reduce((sum, m) => sum + currentPercentages[m], 0);
            if (Math.abs(total - 100) > 0.01 && total > 0) {
                let ratio = 100 / total;
                members.forEach(m => currentPercentages[m] *= ratio);
            }
        }

        function renderUI() {
            document.getElementById('membersList').innerHTML = members.map(m => `
                <span class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 shadow-sm border border-indigo-200">
                    ${m}
                    <button onclick="removeMember('${m}')" class="text-indigo-400 hover:text-red-500 transition text-lg leading-none focus:outline-none">&times;</button>
                </span>
            `).join('');
            
            let needsInit = false;
            members.forEach(m => {
                if(currentPercentages[m] === undefined || isNaN(currentPercentages[m])) needsInit = true;
            });
            if(needsInit || Object.keys(currentPercentages).length !== members.length) {
                initPercentages();
            }
            
            renderExpenseInputs();
            renderExpensesTable();
        }

        function renderExpenseInputs(paidValues = null) {
            const container = document.getElementById('membersExpenseInputs');
            if(members.length === 0) {
                container.innerHTML = '<div class="text-center p-6 text-gray-500 bg-white rounded-lg border border-dashed border-gray-300">הוסף חברים כדי להתחיל להזין הוצאות</div>';
                return;
            }

            container.innerHTML = members.map(m => `
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm transition-all hover:shadow-md">
                    <div class="font-bold text-indigo-900 mb-3 text-lg">${m}</div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-2">סכום ששולם בפועל</label>
                            <input type="number" class="paid-amount border p-2 rounded-lg w-full focus:ring-2 focus:ring-indigo-300 outline-none transition" data-name="${m}" value="${paidValues ? (paidValues[m] || '') : ''}" placeholder="0" min="0" step="0.01">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-2">חלוקת צריכה אישית</label>
                            <div class="flex items-center justify-between bg-gray-50 p-1.5 rounded-lg border border-gray-200">
                                <button onclick="updatePercentage('${m}', -5)" class="bg-red-100 text-red-600 hover:bg-red-200 hover:text-red-700 w-12 h-10 rounded-md font-bold text-xl flex items-center justify-center transition shadow-sm">-</button>
                                <span class="font-mono font-bold text-gray-800 text-lg w-16 text-center">${Math.round(currentPercentages[m])}%</span>
                                <button onclick="updatePercentage('${m}', 5)" class="bg-green-100 text-green-600 hover:bg-green-200 hover:text-green-700 w-12 h-10 rounded-md font-bold text-xl flex items-center justify-center transition shadow-sm">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function saveExpense() {
            if(members.length === 0) return alert("יש להוסיף לפחות חבר אחד.");
            
            const desc = document.getElementById('expDesc').value.trim();
            const date = document.getElementById('expDate').value || new Date().toISOString().split('T')[0];
            const editId = document.getElementById('editExpenseId').value;
            
            if(!desc) {
                alert("אנא הזן תיאור להוצאה.");
                document.getElementById('expDesc').focus();
                return;
            }

            let paid = {};
            let dist = {};
            let totalAmount = 0;

            document.querySelectorAll('.paid-amount').forEach(input => {
                let val = parseFloat(input.value) || 0;
                paid[input.dataset.name] = val;
                totalAmount += val;
            });

            if(totalAmount <= 0) {
                alert("אנא הזן סכום ששולם בפועל לאחד החברים לפחות.");
                return;
            }

            members.forEach(m => {
                dist[m] = currentPercentages[m] / 100;
            });

            if (editId) {
                const index = expenses.findIndex(e => e.id == editId);
                if (index !== -1) {
                    expenses[index] = { id: parseInt(editId), date, desc, amount: totalAmount, paid, dist };
                }
            } else {
                expenses.push({ id: Date.now(), date, desc, amount: totalAmount, paid, dist });
            }

            saveData(); 
            cancelEdit(); 
            calculateSettlement(); 
        }

        function editExpense(id) {
            const expenseToEdit = expenses.find(e => e.id == id);
            if (!expenseToEdit) return;

            document.getElementById('editExpenseId').value = expenseToEdit.id;
            document.getElementById('expDate').value = expenseToEdit.date;
            document.getElementById('expDesc').value = expenseToEdit.desc;
            
            document.getElementById('expenseFormTitle').innerText = "2. עריכת הוצאה";
            document.getElementById('saveExpenseBtn').innerText = "עדכן הוצאה";
            document.getElementById('saveExpenseBtn').classList.replace('bg-emerald-600', 'bg-blue-600');
            document.getElementById('saveExpenseBtn').classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700');
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            let tempPercentages = {};
            let totalPercentageFromExisting = 0;
            let existingMembersCount = 0;

            members.forEach(m => {
                if (expenseToEdit.dist[m] !== undefined) {
                    tempPercentages[m] = expenseToEdit.dist[m] * 100;
                    totalPercentageFromExisting += tempPercentages[m];
                    existingMembersCount++;
                } else {
                    tempPercentages[m] = 0;
                }
            });

            if (existingMembersCount > 0 && Math.abs(totalPercentageFromExisting - 100) > 0.01) {
                 let ratio = 100 / totalPercentageFromExisting;
                 for (let m in tempPercentages) {
                     tempPercentages[m] *= ratio;
                 }
            } else if (existingMembersCount === 0) {
                 members.forEach(m => tempPercentages[m] = 100 / members.length);
            }

            currentPercentages = Object.assign({}, tempPercentages);
            renderExpenseInputs(expenseToEdit.paid);
            document.getElementById('expenseFormTitle').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editExpenseId').value = '';
            document.getElementById('expDesc').value = '';
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
            
            document.getElementById('expenseFormTitle').innerText = "2. הוספת הוצאה";
            document.getElementById('saveExpenseBtn').innerText = "שמור הוצאה";
            document.getElementById('saveExpenseBtn').classList.replace('bg-blue-600', 'bg-emerald-600');
            document.getElementById('saveExpenseBtn').classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
            document.getElementById('cancelEditBtn').classList.add('hidden');
            
            initPercentages();
            renderExpenseInputs(); 
            renderExpensesTable(); 
        }

        function deleteExpense(id) {
            if(confirm("למחוק הוצאה זו?")) {
                expenses = expenses.filter(e => e.id !== id);
                saveData(); 
                renderExpensesTable();
                
                if (document.getElementById('editExpenseId').value == id) {
                    cancelEdit();
                }
                calculateSettlement(); 
            }
        }

        function renderExpensesTable() {
            const tbody = document.getElementById('expensesTableBody');
            if(expenses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500 italic">לא נרשמו הוצאות עדיין.</td></tr>';
                return;
            }

            const sortedExpenses = [...expenses].sort((a,b) => new Date(a.date) - new Date(b.date) || a.id - b.id);

            tbody.innerHTML = sortedExpenses.map(e => `
                <tr class="border-b hover:bg-gray-50 transition">
                    <td class="p-3 text-gray-600 whitespace-nowrap">${e.date}</td>
                    <td class="p-3 font-semibold text-gray-800">${e.desc}</td>
                    <td class="p-3 font-mono font-bold text-indigo-700">${e.amount.toFixed(2)}</td>
                    <td class="p-3 text-center flex justify-center gap-2">
                        <button onclick="editExpense(${e.id})" class="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-2 rounded-lg transition" title="ערוך הוצאה">✏️</button>
                        <button onclick="deleteExpense(${e.id})" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition" title="מחק הוצאה">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        // מחשב את המאזן לשורה בודדת
        function getRowSettlement(expense) {
            let rowBalances = {};
            let allMembersInRow = new Set([...Object.keys(expense.paid), ...Object.keys(expense.dist)]);
            
            allMembersInRow.forEach(m => {
                let paid = expense.paid[m] || 0;
                let consumed = expense.amount * (expense.dist[m] || 0);
                rowBalances[m] = paid - consumed;
            });

            let debtors = [];
            let creditors = [];
            for (let m in rowBalances) {
                if (rowBalances[m] < -0.01) debtors.push({ name: m, amount: Math.abs(rowBalances[m]) });
                else if (rowBalances[m] > 0.01) creditors.push({ name: m, amount: rowBalances[m] });
            }

            let settlementText = [];
            debtors.sort((a,b) => b.amount - a.amount);
            creditors.sort((a,b) => b.amount - a.amount);

            let dIdx = 0, cIdx = 0;
            while (dIdx < debtors.length && cIdx < creditors.length) {
                let debtor = debtors[dIdx];
                let creditor = creditors[cIdx];
                let amountToTransfer = Math.min(debtor.amount, creditor.amount);
                
                if (amountToTransfer > 0.01) {
                    settlementText.push(`${debtor.name} <span class="mx-1 text-gray-400">➔</span> ${creditor.name} (${amountToTransfer.toFixed(2)})`);
                }
                
                debtor.amount -= amountToTransfer;
                creditor.amount -= amountToTransfer;
                
                if (debtor.amount < 0.01) dIdx++;
                if (creditor.amount < 0.01) cIdx++;
            }
            return settlementText.length > 0 ? settlementText.join('<br>') : '<span class="text-gray-400 italic">מאוזן</span>';
        }

        // מחשב את המאזן הכללי
        function getSettlementLinesData() {
            let allInvolvedMembers = new Set(members);
            expenses.forEach(ex => {
                Object.keys(ex.paid).forEach(m => allInvolvedMembers.add(m));
                Object.keys(ex.dist).forEach(m => allInvolvedMembers.add(m));
            });

            let balances = {};
            allInvolvedMembers.forEach(m => balances[m] = 0);

            expenses.forEach(ex => {
                allInvolvedMembers.forEach(m => {
                    let paidByHim = ex.paid[m] || 0;
                    let consumedByHim = ex.amount * (ex.dist[m] || 0);
                    balances[m] += (paidByHim - consumedByHim);
                });
            });

            let debtors = [];
            let creditors = [];
            
            for (let m in balances) {
                if (balances[m] < -0.01) debtors.push({ name: m, amount: Math.abs(balances[m]) });
                else if (balances[m] > 0.01) creditors.push({ name: m, amount: balances[m] });
            }

            let settlementLines = [];
            debtors.sort((a,b) => b.amount - a.amount);
            creditors.sort((a,b) => b.amount - a.amount);

            let dIdx = 0;
            let cIdx = 0;

            while (dIdx < debtors.length && cIdx < creditors.length) {
                let debtor = debtors[dIdx];
                let creditor = creditors[cIdx];
                
                let amountToTransfer = Math.min(debtor.amount, creditor.amount);
                
                if (amountToTransfer > 0.01) {
                    settlementLines.push({ debtor: debtor.name, creditor: creditor.name, amount: amountToTransfer });
                }
                
                debtor.amount -= amountToTransfer;
                creditor.amount -= amountToTransfer;
                
                if (debtor.amount < 0.01) dIdx++;
                if (creditor.amount < 0.01) cIdx++;
            }
            return settlementLines;
        }

        function calculateSettlement() {
            const resultsArea = document.getElementById('resultsArea');
            
            if(expenses.length === 0) {
                resultsArea.classList.add('hidden');
                return;
            }

            let settlementData = getSettlementLinesData();
            resultsArea.classList.remove('hidden');
            
            if (settlementData.length === 0) {
                resultsArea.innerHTML = `<div class="flex items-center gap-3">
                                            <span class="text-2xl">🎉</span> 
                                            <div>
                                                <h3 class="font-bold text-lg text-green-800">הכל מאוזן!</h3>
                                                <p class="text-green-700">אין צורך בהעברות כספיות נוספות, כולם שילמו בדיוק את חלקם.</p>
                                            </div>
                                         </div>`;
                resultsArea.className = "mt-4 p-5 bg-green-50 rounded-xl border border-green-200 text-base font-medium shadow-sm block";
            } else {
                let formattedLines = settlementData.map(line => 
                    `<li>• <span class="font-bold text-indigo-700">${line.debtor}</span> יעביר/תעביר ל-<span class="font-bold text-indigo-700">${line.creditor}</span>: <span class="font-bold text-indigo-700">${line.amount.toFixed(2)}</span></li>`
                ).join('');

                resultsArea.innerHTML = `<h3 class='font-bold text-xl mb-4 border-b border-purple-200 pb-3 text-purple-800 flex items-center gap-2'>
                                            סיכום העברות נדרשות
                                         </h3>
                                         <ul class="space-y-3 pr-2">
                                            ${formattedLines}
                                         </ul>`;
                resultsArea.className = "mt-4 p-6 bg-purple-50 rounded-xl border border-purple-200 text-base text-gray-800 shadow-sm block";
            }
        }

        function openReport() {
            if(expenses.length === 0) return alert("אין הוצאות להצגה בדוח.");
            
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('reportView').classList.remove('hidden');
            window.scrollTo(0, 0);

            const totalAmount = expenses.reduce((sum, ex) => sum + ex.amount, 0);
            
            let html = `
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-extrabold text-indigo-800 mb-2">דוח הוצאות חופשה מפורט</h1>
                    <p class="text-gray-600 text-lg">סך הכל הוצאות: <strong>${totalAmount.toFixed(2)}</strong></p>
                    <p class="text-gray-500 text-sm mt-1">הופק בתאריך: ${new Date().toLocaleDateString('he-IL')}</p>
                </div>
                
                <h2 class="text-xl font-bold mb-4 text-indigo-700 border-b pb-2">פירוט כלל ההוצאות</h2>
                <div class="overflow-x-auto mb-8">
                    <table class="w-full text-sm border-collapse text-right border border-gray-300">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border border-gray-300 p-2">תאריך</th>
                                <th class="border border-gray-300 p-2">תיאור</th>
                                <th class="border border-gray-300 p-2">סה"כ</th>
                                <th class="border border-gray-300 p-2">פירוט תשלום</th>
                                <th class="border border-gray-300 p-2">צריכה / חלוקה</th>
                                <th class="border border-gray-300 p-2 bg-yellow-50 text-yellow-900">התחשבנות פנימית (בשורה זו)</th>
                                <th class="border border-gray-300 p-2 bg-purple-50 text-purple-900">התחשבנות מצטברת (לאחר שורה זו)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            const sortedExpenses = [...expenses].sort((a,b) => new Date(a.date) - new Date(b.date) || a.id - b.id);
            
            // אוספים את כל החברים שאי פעם השתתפו, כדי לנהל מאזן ריצה מצטבר לכולם
            let allInvolved = new Set(members);
            sortedExpenses.forEach(ex => {
                Object.keys(ex.paid).forEach(m => allInvolved.add(m));
                Object.keys(ex.dist).forEach(m => allInvolved.add(m));
            });
            
            let runningBalances = {};
            allInvolved.forEach(m => runningBalances[m] = 0);

            sortedExpenses.forEach(ex => {
                let paidList = Object.entries(ex.paid)
                    .filter(([m, amount]) => amount > 0)
                    .map(([m, amount]) => `<div class="mb-1"><span class="font-bold">${m}:</span> ${amount.toFixed(2)}</div>`)
                    .join('');
                
                let distList = Object.entries(ex.dist)
                    .filter(([m, pct]) => pct > 0)
                    .map(([m, pct]) => `<div class="mb-1"><span class="font-bold">${m}:</span> ${Math.round(pct * 100)}% (${(ex.amount * pct).toFixed(2)})</div>`)
                    .join('');
                
                let rowSettlement = getRowSettlement(ex);
                
                // חישוב המאזן המצטבר הכללי עד לנקודה זו
                allInvolved.forEach(m => {
                    let paid = ex.paid[m] || 0;
                    let consumed = ex.amount * (ex.dist[m] || 0);
                    runningBalances[m] += (paid - consumed);
                });

                let debtors = [];
                let creditors = [];
                for (let m in runningBalances) {
                    if (runningBalances[m] < -0.01) debtors.push({ name: m, amount: Math.abs(runningBalances[m]) });
                    else if (runningBalances[m] > 0.01) creditors.push({ name: m, amount: runningBalances[m] });
                }
                debtors.sort((a,b) => b.amount - a.amount);
                creditors.sort((a,b) => b.amount - a.amount);

                let cumulativeText = [];
                let dIdx = 0, cIdx = 0;
                
                // העתקת המערכים כדי לא לפגוע בסכום המקורי בהמשך הלולאה
                let tempDebtors = debtors.map(d => ({...d}));
                let tempCreditors = creditors.map(c => ({...c}));
                
                while (dIdx < tempDebtors.length && cIdx < tempCreditors.length) {
                    let d = tempDebtors[dIdx];
                    let c = tempCreditors[cIdx];
                    let transfer = Math.min(d.amount, c.amount);
                    
                    if (transfer > 0.01) {
                        cumulativeText.push(`${d.name} <span class="mx-1 text-gray-400">➔</span> ${c.name} <span class="font-bold">(${transfer.toFixed(2)})</span>`);
                    }
                    
                    d.amount -= transfer;
                    c.amount -= transfer;
                    
                    if (d.amount < 0.01) dIdx++;
                    if (c.amount < 0.01) cIdx++;
                }
                
                let cumulativeHtml = cumulativeText.length > 0 ? cumulativeText.join('<br>') : '<span class="text-gray-400 italic">מאוזן</span>';

                html += `
                    <tr class="hover:bg-gray-50">
                        <td class="border border-gray-300 p-2 align-top text-gray-600 whitespace-nowrap">${ex.date}</td>
                        <td class="border border-gray-300 p-2 align-top font-bold">${ex.desc}</td>
                        <td class="border border-gray-300 p-2 align-top font-bold text-indigo-700">${ex.amount.toFixed(2)}</td>
                        <td class="border border-gray-300 p-2 align-top bg-blue-50/50">${paidList || '-'}</td>
                        <td class="border border-gray-300 p-2 align-top bg-green-50/50">${distList || '-'}</td>
                        <td class="border border-gray-300 p-2 align-top bg-yellow-50/50 text-yellow-900">${rowSettlement}</td>
                        <td class="border border-gray-300 p-2 align-top bg-purple-50/50 text-purple-900">${cumulativeHtml}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;

            let settlementData = getSettlementLinesData();
            html += `<h2 class="text-xl font-bold mb-4 text-indigo-700 border-b pb-2">סיכום התחשבנות כולל לאיזון</h2>`;
            
            if (settlementData.length === 0) {
                html += `<p class="text-green-700 font-bold bg-green-50 p-4 rounded border border-green-200 text-center text-lg">הכל מאוזן! אין העברות כספיות נדרשות.</p>`;
            } else {
                html += `<ul class="space-y-3 bg-purple-50 p-6 rounded border border-purple-200">`;
                settlementData.forEach(line => {
                    html += `<li class="text-lg flex items-center gap-2">
                        <span class="text-purple-500 font-black">•</span>
                        <span class="font-bold text-indigo-700">${line.debtor}</span> 
                        <span class="text-gray-500">מעביר/ה ל-</span> 
                        <span class="font-bold text-indigo-700">${line.creditor}</span> 
                        <span class="text-gray-400 mx-1">➔</span>
                        <strong>${line.amount.toFixed(2)}</strong>
                    </li>`;
                });
                html += `</ul>`;
            }

            document.getElementById('reportContent').innerHTML = html;
        }

        function closeReport() {
            document.getElementById('reportView').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        }

        window.onload = () => {
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
            loadData(); 
            renderUI();
            calculateSettlement();
        };
    </script>
</body>
</html>
