<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Make Password</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --success: #22c55e;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
  }
  .header {
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--surface2);
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 {
    font-size: 18px; font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  /* --- Placeholder password output --- */
  .password-output {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 20px;
    letter-spacing: 1px;
    background: var(--bg);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    word-break: break-all;
    color: var(--success);
    margin-bottom: 12px;
  }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: var(--surface2);
    color: var(--text);
  }

  /* --- Placeholder options --- */
  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--surface2);
    color: var(--text-muted);
  }
  .option-row:last-child { border-bottom: none; }

  .todo-note {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 24px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Make Password</h1>
  </div>

  <main>
    <div class="card">
      <!-- TODO: replace with real generated password -->
      <div class="password-output" id="passwordOutput">P!aceh0lder-Pass</div>
      <div class="actions">
        <button class="secondary" id="copyBtn">Copy</button>
        <button id="generateBtn">Generate</button>
      </div>
    </div>

    <div class="card">
      <!-- TODO: wire these options into actual generation logic -->
      <div class="option-row">
        <span>Length</span>
        <span>16</span>
      </div>
      <div class="option-row">
        <span>Uppercase</span>
        <span>On</span>
      </div>
      <div class="option-row">
        <span>Numbers</span>
        <span>On</span>
      </div>
      <div class="option-row">
        <span>Symbols</span>
        <span>On</span>
      </div>
    </div>

    <p class="todo-note">
      Placeholder UI. Password generation, option controls, and copy-to-clipboard
      logic still need to be implemented.
    </p>
  </main>

  <script>
    // TODO: implement real password generation
    document.getElementById('generateBtn').addEventListener('click', () => {
      alert('TODO: generate a real password');
    });

    // TODO: implement clipboard copy
    document.getElementById('copyBtn').addEventListener('click', () => {
      alert('TODO: copy password to clipboard');
    });
  </script>
</body>
</html>
